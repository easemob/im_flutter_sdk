name: agora_chat_sdk_ios
description: Integrate the Chat SDK to enjoy the global IM services with high reliability, ultra-low latency, and high concurrency.
version: 2.0.0
homepage: https://www.agora.io/en/

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  agora_chat_sdk_interface: 2.0.0



dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: agora_chat_sdk
    platforms:
      ios:
        dartPluginClass: ClientIOS
        pluginClass: ImFlutterSdkPlugin
