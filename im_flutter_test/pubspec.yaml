name: im_flutter_test
description: "环信 Flutter SDK 自动化测试桥接端（被测设备 App）。依赖发布版 im_flutter_sdk，承载 WebSocket 桥接与测试脚手架。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 读取 native-auto-test/config.yaml（通过 assets 软链）。
  yaml: ^3.1.2

  # 依赖发布版 SDK（path 本地引入；发布版本直接走 im_flutter_sdk 目录）。
  im_flutter_sdk:
    path: ../im_flutter_sdk

  # 桥接用到 Client / callNativeMethod（ManagerMixin），来自接口包。
  im_flutter_sdk_interface:
    path: ../im_flutter_sdk_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.yaml
    - assets/media/
