name: im_flutter_test
description: "环信原生 SDK 自动化测试 Runner。通过 im_flutter_sdk_interface 承载 WebSocket 桥接与测试脚手架。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 读取 native-auto-test/config.yaml（通过 assets 软链）。
  yaml: ^3.1.2

  # 唯一 SDK 调用边界：Client / ManagerMixin / MethodChannel。
  im_flutter_sdk_interface:
    path: ../im_flutter_sdk_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.yaml
    - assets/media/
