plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.easemob.im_flutter_test"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.easemob.im_flutter_test"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "chatSdk"
    productFlavors {
        sdk410 {
            dimension = "chatSdk"
            buildConfigField "String", "CHAT_SDK_VERSION", "\"4.10.0\""
        }
        sdk414 {
            dimension = "chatSdk"
            buildConfigField "String", "CHAT_SDK_VERSION", "\"4.14.0\""
        }
        sdk423 {
            dimension = "chatSdk"
            buildConfigField "String", "CHAT_SDK_VERSION", "\"4.23.0\""
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 每个产物只解析一个真实原生 SDK 版本；不能通过运行时字符串伪装版本。
    sdk410Implementation "io.hyphenate:hyphenate-chat:4.10.0"
    sdk414Implementation "io.hyphenate:hyphenate-chat:4.14.0"
    // 4.23 基线直接复用发布平台 Wrapper；测试 App 不再复制业务 API。
    sdk423Implementation project(":im_flutter_sdk_android")
}
