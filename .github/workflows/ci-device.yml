name: Flutter Device Regression

# Replaces the old device-smoke and single-account-nightly workflows: one
# workflow covers both the no-login smoke (logged_out entry) and the
# single-account logged-in regression (nightly suites). All four lanes are
# independent and run in parallel: a failing test case — an expected signal
# while known native bugs are tracked — must never delay or block another
# lane, and a workflow-level failure on one platform must not starve the
# other. The iOS lanes additionally patch the pinned flutter tool with the
# upstream fix for the iOS simulator VM Service race (see
# tool/ci/patch_flutter_ios_log_stream.sh). Local runs match CI exactly:
# tool/ci/smoke_local.sh and tool/ci/nightly_local.sh call the same runner
# scripts the lanes use.

on:
  schedule:
    # NOTE: scheduled workflows take the workflow file from the default
    # branch (flutter2_stable), so this cron only takes effect once this
    # file lands there. On 5.1.0 use workflow_dispatch. Runs one hour
    # before the React Native device regression (19:37 UTC).
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Do not cancel mid-run: a lane that already logged in would leave the
  # emulator/simulator session half-cleaned, and the daily schedule rarely
  # overlaps.
  group: flutter-ci-device-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  android-logged-out:
    name: Android logged-out smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable KVM group perms
        # The ubuntu-24.04 runner image has /dev/kvm but the runner user is
        # not in the kvm group (actions/runner-images#8542). Without this
        # udev rule the emulator silently falls back to ~10x slower software
        # emulation and the job times out before the app starts.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run logged-out smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Multi-line scripts are not run in one shell session by the
          # runner, so the real steps live in a wrapper script.
          # No secrets in this lane: the no-login test uses the public demo
          # app key built into the test as its default.
          script: bash tool/ci/run_android_emulator_test.sh integration_test/logged_out_test.dart

      - name: Upload Android logged-out evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-ci-device-android-logged-out-${{ github.run_id }}
          path: |
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 7

  android-logged-in:
    name: Android logged-in regression
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: flutter-single-account
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare protected test configuration
        # 5.0.0 has no password login, and user tokens expire in ~24h so they
        # cannot be stored as secrets: exchange the app credentials for a fresh
        # token here, before the emulator/simulator boots (fail fast on auth
        # problems).
        env:
          E2E_APP_KEY: ${{ secrets.E2E_APP_KEY }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_REST_API: ${{ secrets.E2E_REST_API }}
          E2E_CLIENT_ID: ${{ secrets.E2E_CLIENT_ID }}
          E2E_CLIENT_SECRET: ${{ secrets.E2E_CLIENT_SECRET }}
        run: |
          ./tool/ci/write_e2e_dart_defines.sh "$RUNNER_TEMP/flutter-single-account.json"
          echo "E2E_CONFIG_PATH=$RUNNER_TEMP/flutter-single-account.json" >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        # The ubuntu-24.04 runner image has /dev/kvm but the runner user is
        # not in the kvm group (actions/runner-images#8542). Without this
        # udev rule the emulator silently falls back to ~10x slower software
        # emulation and the job times out before the app starts.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run logged-in regression on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Multi-line scripts are not run in one shell session by the
          # runner, so the real steps live in a wrapper script.
          script: bash tool/ci/nightly_local.sh android

      - name: Remove protected test configuration
        if: always()
        run: rm -f "${E2E_CONFIG_PATH:-$RUNNER_TEMP/flutter-single-account.json}"

      - name: Upload Android logged-in evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-ci-device-android-logged-in-${{ github.run_id }}
          path: |
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 7

  ios-logged-out:
    name: iOS logged-out smoke
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Patch flutter tool (iOS simulator log stream race)
        # Applies the upstream fix for flutter/flutter#181771 to the pinned
        # SDK; no stable release carries it yet. Idempotent and bound to
        # FLUTTER_VERSION — see tool/ci/patch_flutter_ios_log_stream.sh.
        run: bash tool/ci/patch_flutter_ios_log_stream.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # iOS dependencies resolve via SPM (no CocoaPods in this repo). Their
        # binary targets download from download.shengwang.cn, which has timed
        # out from GitHub runners and failed the job before any test ran.
        # Caching the SPM stores removes that network dependency once fetched.
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', 'im_flutter_sdk/example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run logged-out smoke on iOS simulator
        run: ./tool/ci/run_ios_simulator_test.sh integration_test/logged_out_test.dart

      - name: Collect iOS diagnostics after failure
        if: failure()
        # Xcode 26 simctl only accepts --output=<path> (equals form) and
        # pauses on an interactive "Press ENTER" prompt unless stdin is fed.
        # The archive is written as <path>.tar.gz next to the given path.
        run: echo | xcrun simctl diagnose -b --output=artifacts/diagnose || true

      - name: Upload iOS logged-out evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-ci-device-ios-logged-out-${{ github.run_id }}
          path: |
            artifacts/ci/
            artifacts/*diagnose*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  ios-logged-in:
    name: iOS logged-in regression
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    environment: flutter-single-account
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Patch flutter tool (iOS simulator log stream race)
        # Applies the upstream fix for flutter/flutter#181771 to the pinned
        # SDK; no stable release carries it yet. Idempotent and bound to
        # FLUTTER_VERSION — see tool/ci/patch_flutter_ios_log_stream.sh.
        run: bash tool/ci/patch_flutter_ios_log_stream.sh

      - name: Prepare protected test configuration
        # 5.0.0 has no password login, and user tokens expire in ~24h so they
        # cannot be stored as secrets: exchange the app credentials for a fresh
        # token here, before the emulator/simulator boots (fail fast on auth
        # problems).
        env:
          E2E_APP_KEY: ${{ secrets.E2E_APP_KEY }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_REST_API: ${{ secrets.E2E_REST_API }}
          E2E_CLIENT_ID: ${{ secrets.E2E_CLIENT_ID }}
          E2E_CLIENT_SECRET: ${{ secrets.E2E_CLIENT_SECRET }}
        run: |
          ./tool/ci/write_e2e_dart_defines.sh "$RUNNER_TEMP/flutter-single-account.json"
          echo "E2E_CONFIG_PATH=$RUNNER_TEMP/flutter-single-account.json" >> "$GITHUB_ENV"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # iOS dependencies resolve via SPM (no CocoaPods in this repo). Their
        # binary targets download from download.shengwang.cn, which has timed
        # out from GitHub runners and failed the job before any test ran.
        # Caching the SPM stores removes that network dependency once fetched.
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', 'im_flutter_sdk/example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run logged-in regression on iOS simulator
        run: bash tool/ci/nightly_local.sh ios

      - name: Collect iOS diagnostics after failure
        if: failure()
        # Xcode 26 simctl only accepts --output=<path> (equals form) and
        # pauses on an interactive "Press ENTER" prompt unless stdin is fed.
        # The archive is written as <path>.tar.gz next to the given path.
        run: echo | xcrun simctl diagnose -b --output=artifacts/diagnose || true

      - name: Remove protected test configuration
        if: always()
        run: rm -f "${E2E_CONFIG_PATH:-$RUNNER_TEMP/flutter-single-account.json}"

      - name: Upload iOS logged-in evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-ci-device-ios-logged-in-${{ github.run_id }}
          path: |
            artifacts/ci/
            artifacts/*diagnose*.tar.gz
          if-no-files-found: warn
          retention-days: 7
