name: Flutter Single Account Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-single-account-nightly
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  android:
    name: Android login and local database
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: flutter-single-account
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare protected test configuration
        env:
          E2E_APP_KEY: ${{ secrets.E2E_APP_KEY }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          ./tool/ci/write_e2e_dart_defines.sh "$RUNNER_TEMP/flutter-single-account.json"
          echo "E2E_CONFIG_PATH=$RUNNER_TEMP/flutter-single-account.json" >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        # The ubuntu-24.04 runner image has /dev/kvm but the runner user is
        # not in the kvm group (actions/runner-images#8542). Without this
        # udev rule the emulator silently falls back to ~10x slower software
        # emulation and the job times out before the app starts.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run login and local database suite on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Multi-line scripts are not run in one shell session by the
          # runner, so the real steps live in a wrapper script.
          script: bash tool/ci/run_android_emulator_test.sh integration_test/single_account_local_test.dart android-single-account.log

      - name: Remove protected test configuration
        if: always()
        run: rm -f "${E2E_CONFIG_PATH:-$RUNNER_TEMP/flutter-single-account.json}"

      - name: Upload Android Nightly log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-single-account-android-${{ github.run_id }}
          path: artifacts/android-single-account.log
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS login and local database
    needs: android
    if: ${{ always() }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    environment: flutter-single-account
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare protected test configuration
        env:
          E2E_APP_KEY: ${{ secrets.E2E_APP_KEY }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          ./tool/ci/write_e2e_dart_defines.sh "$RUNNER_TEMP/flutter-single-account.json"
          echo "E2E_CONFIG_PATH=$RUNNER_TEMP/flutter-single-account.json" >> "$GITHUB_ENV"

      - name: Run login and local database suite on iOS simulator
        run: ./tool/ci/run_ios_simulator_test.sh integration_test/single_account_local_test.dart ios-single-account.log

      - name: Collect iOS diagnostics after failure
        if: failure()
        # Xcode 26 simctl only accepts --output=<path> (equals form) and
        # pauses on an interactive "Press ENTER" prompt unless stdin is fed.
        # The archive is written as <path>.tar.gz next to the given path.
        run: echo | xcrun simctl diagnose -b --output=artifacts/diagnose || true

      - name: Remove protected test configuration
        if: always()
        run: rm -f "${E2E_CONFIG_PATH:-$RUNNER_TEMP/flutter-single-account.json}"

      - name: Upload iOS Nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-single-account-ios-${{ github.run_id }}
          path: |
            artifacts/ios-single-account.log*
            artifacts/*diagnose*.tar.gz
          if-no-files-found: warn
          retention-days: 7
