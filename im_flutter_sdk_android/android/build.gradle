group 'com.easemob.im_flutter_sdk'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:7.3.0')
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
apply plugin: 'com.android.library'

def flutterProperties = new Properties()
rootProject.file('local.properties').withInputStream {
    flutterProperties.load(it)
}
def flutterSdkRoot = flutterProperties.getProperty('flutter.sdk')
def flutterEngineRevision = file(
    "${flutterSdkRoot}/bin/internal/engine.version"
).text.trim()

android {
    if (project.android.hasProperty('namespace')) {
        namespace = 'com.easemob.im_flutter_sdk'
    }
    compileSdk = 34
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdk = 21
    }
    // 每个 flavor 对应一个 SDK 版本，jar 在 src/<flavor>/libs，jniLibs 在 src/<flavor>/jniLibs。
    // 切换 SDK 版本不需要改代码；app 侧同 flavor 名自动匹配本 library 的 flavor。
    flavorDimensions 'chatSdk'
    productFlavors {
        sdk423 {
            dimension 'chatSdk'
        }
        sdk500 {
            dimension 'chatSdk'
        }
    }
    // 每个 flavor 用独立的 java 源集（同名类覆盖 main，实现版本差异 wrapper）；
    // jniLibs 指向各自版本的 .so。
    sourceSets {
        sdk423 {
            java.srcDirs = ['src/sdk423/java']
            jniLibs.srcDirs = ['src/sdk423/jniLibs']
        }
        sdk500 {
            java.srcDirs = ['src/sdk500/java']
            jniLibs.srcDirs = ['src/sdk500/jniLibs']
        }
    }
}

tasks.withType(JavaCompile){
    options.encoding = 'UTF-8'
}

dependencies {
    api 'androidx.appcompat:appcompat:1.1.0'
    // 手动作为 Android library 引入时，编译期仍需要 Flutter embedding；
    // 运行期由宿主 Flutter App 提供。
    compileOnly "io.flutter:flutter_embedding_debug:1.0.0-${flutterEngineRevision}"

    // 本地依赖（默认）：按 flavor 引对应版本的 JAR。替换 JAR 后务必 clean 再编译。
    sdk423Api files('./src/sdk423/libs/hyphenatechat_4.23.0.jar')
    sdk500Api files('./src/sdk500/libs/hyphenatechat_5.0.0.jar')
    // 远程依赖（改为远程时，注释掉上面的 files(...)，取消下一行注释）
    // sdk423Api 'io.hyphenate:hyphenate-chat:4.23.0'
    // sdk500Api 'io.hyphenate:hyphenate-chat:5.0.0'
}
