name: im_flutter_sdk_ios
description: "A new Flutter plugin project."
version: 4.13.0
homepage:

environment:
  sdk: '>=3.3.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  im_flutter_sdk_interface:
    path: ../im_flutter_sdk_interface

