name: agora_chat_sdk
description: Integrate the Chat SDK to enjoy the global IM services with high reliability, ultra-low latency, and high concurrency.
version: 2.0.0
homepage: https://www.agora.io/en/

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  agora_chat_sdk_interface: 2.0.0

  agora_chat_sdk_ios: 2.0.0

  agora_chat_sdk_android: 2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  plugin:
    platforms:
      ios:
        default_package: agora_chat_sdk_ios
      android:
        default_package: agora_chat_sdk_android
