# Edit one received message and require its exact content-change notification.
name: 5.0.0-multi-message-edit-positive
flowTimeoutMs: 240000
agents:
  alice: {script: 5.0.0-multi-message-edit-positive.json}
  bob: {script: 5.0.0-multi-message-edit-positive.json}
defaults:
  stepTimeoutMs: 30000
steps:
  - set: {alice_logged_in: false, bob_logged_in: false, alice_ready: false, bob_ready: false}
  - parallel:
      alice_login:
        - cmd: init
          agent: alice
          as: global.biz.result.alice_init
          onFail: abort_flow
        - cmd: login_alice
          agent: alice
          as: global.biz.result.alice_login
          onFail: abort_flow
        - set: {alice_logged_in: true}
        - cmd: connected
          agent: alice
          as: global.biz.result.alice_connected
          onFail: abort_flow
        - set: {alice_ready: true}
      bob_login:
        - cmd: init
          agent: bob
          as: global.biz.result.bob_init
          onFail: abort_flow
        - cmd: login_bob
          agent: bob
          as: global.biz.result.bob_login
          onFail: abort_flow
        - set: {bob_logged_in: true}
        - cmd: connected
          agent: bob
          as: global.biz.result.bob_connected
          onFail: abort_flow
        - set: {bob_ready: true}
  - if: '$alice_ready and $bob_ready'
    then:
      # Keep failures inside this branch so both devices can still log out.
      - parallel:
          edit:
            - cmd: send
              agent: alice
              as: global.biz.result.sent
              timeoutMs: 45000
              onFail: abort_flow
            - wait_event: onMessagesReceived
              agent: bob
              checks:
                - path: messages
                  containsItem:
                    msgId: '$global.biz.result.sent.data.msgId'
                    from: '$global.account.alice.userId'
                    to: '$global.account.bob.userId'
                    body.type: 0
                    body.content: '$global.biz.input.messageContent'
              as: global.biz.event.received
              onFail: abort_flow
            - cmd: edit
              agent: alice
              as: global.biz.result.edited
              onFail: abort_flow
            - wait_event: onMessageContentChanged
              agent: bob
              match:
                operatorId: '$global.account.alice.userId'
                message.msgId: '$global.biz.result.sent.data.msgId'
                message.from: '$global.account.alice.userId'
                message.to: '$global.account.bob.userId'
                message.body.type: 0
                message.body.content: '$global.biz.input.editedContent'
                message.attributes.testRun: '$global.biz.input.editMarker'
              as: global.biz.event.edited
              onFail: abort_flow
  - parallel:
      alice_exit:
        - if: '$alice_logged_in'
          then:
            - cmd: logout
              agent: alice
              as: global.biz.result.alice_logout
      bob_exit:
        - if: '$bob_logged_in'
          then:
            - cmd: logout
              agent: bob
              as: global.biz.result.bob_logout
