# Publish one unique description; require its callback and restore the prior value.
name: 5.0.0-multi-presence-positive
flowTimeoutMs: 240000
agents:
  alice: {script: 5.0.0-multi-presence-positive.json}
  bob: {script: 5.0.0-multi-presence-positive.json}
defaults:
  stepTimeoutMs: 30000
steps:
  - set:
      alice_logged_in: false
      bob_logged_in: false
      alice_ready: false
      bob_ready: false
      original_found: false
      original_description: null
      subscription_attempted: false
      publication_attempted: false
  - parallel:
      alice_login:
        - cmd: init
          agent: alice
          as: global.biz.result.alice_init
          onFail: abort_flow
        - cmd: login_alice
          agent: alice
          as: global.biz.result.alice_login
          onFail: abort_flow
        - set: {alice_logged_in: true}
        - cmd: connected
          agent: alice
          as: global.biz.result.alice_connected
          onFail: abort_flow
        - set: {alice_ready: true}
      bob_login:
        - cmd: init
          agent: bob
          as: global.biz.result.bob_init
          onFail: abort_flow
        - cmd: login_bob
          agent: bob
          as: global.biz.result.bob_login
          onFail: abort_flow
        - set: {bob_logged_in: true}
        - cmd: connected
          agent: bob
          as: global.biz.result.bob_connected
          onFail: abort_flow
        - set: {bob_ready: true}
  - if: '$alice_ready and $bob_ready'
    then:
      # Scope abort_flow to business work, preserving the outer cleanup steps.
      - parallel:
          business:
            - cmd: unsubscribe
              agent: alice
              as: global.biz.result.reset_subscription
              onFail: abort_flow
            - cmd: capture_presence
              agent: bob
              as: global.biz.result.original
              onFail: abort_flow
            - for: presence in $global.biz.result.original.data
              do:
                - if: '$presence.publisher == $global.account.bob.userId'
                  then:
                    - set:
                        original_found: true
                        original_description: '$presence.statusDescription'
            - if: '$original_found'
              then:
                - set: {subscription_attempted: true}
                - cmd: subscribe
                  agent: alice
                  as: global.biz.result.subscription
                  onFail: abort_flow
                - set: {publication_attempted: true}
                - cmd: publish
                  agent: bob
                  as: global.biz.result.publication
                  onFail: abort_flow
                # The matching event may arrive before publish returns.
                - wait_event: onPresenceStatusChanged
                  agent: alice
                  checks:
                    - path: list
                      containsItem:
                        publisher: '$global.account.bob.userId'
                        statusDescription: '$global.biz.input.presenceDescription'
                  as: global.biz.event.notification
                # Query corroborates the callback; it cannot replace it.
                - cmd: verify_presence
                  agent: alice
                  as: global.biz.result.verification
  - parallel:
      alice_cleanup:
        - if: '$subscription_attempted'
          then:
            - cmd: unsubscribe
              agent: alice
              as: global.biz.result.cleanup_subscription
        - if: '$alice_logged_in'
          then:
            - cmd: logout
              agent: alice
              as: global.biz.result.alice_logout
      bob_cleanup:
        - if: '$publication_attempted and $original_found'
          then:
            - cmd: restore_presence
              agent: bob
              inputs: {desc: '$original_description'}
              as: global.biz.result.restoration
        - if: '$bob_logged_in'
          then:
            - cmd: logout
              agent: bob
              as: global.biz.result.bob_logout
