name: im_flutter_sdk
description: Integrate the Chat SDK to enjoy the global IM services with high reliability, ultra-low latency, and high concurrency.
version: 5.1.0
homepage: https://www.easemob.com

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  im_flutter_sdk_interface: ^4.15.0+1

  im_flutter_sdk_ios: 5.1.0

  im_flutter_sdk_android: 5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  plugin:
    platforms:
      ios:
        default_package: im_flutter_sdk_ios
      android:
        default_package: im_flutter_sdk_android
      # ohos:
      #   default_package: im_flutter_sdk_ohos
