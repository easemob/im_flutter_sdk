name: im_flutter_sdk
description: Integrate the Chat SDK to enjoy the global IM services with high reliability, ultra-low latency, and high concurrency.
version: 4.13.0-beta.1
homepage: https://www.easemob.com

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  im_flutter_sdk_interface: ^4.13.0

  im_flutter_sdk_ios: ^4.13.0

  im_flutter_sdk_android: ^4.13.0


dev_dependencies:
  flutter_lints: ^4.0.0


flutter:
  plugin:
    platforms:
      ios:
        default_package: im_flutter_sdk_ios
      android:
        default_package: im_flutter_sdk_android
      ohos:
        default_package: im_flutter_sdk_ohos
