# =============================================================
# 场景：Android 5.0 单端（2 账号 × 1 端 = 2 模拟器）
# 拓扑模型：account_a → device_a；account_b → device_b
# 用于不需要同账号多设备同步校验的 case。
# =============================================================

name: android-500-single-device-default

accounts:
  account_a:
    provision: rest
  account_b:
    provision: rest
  account_c:
    provision: rest

devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 5.0.0
    account: account_a
    serial: emulator-5554

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 5.0.0
    account: account_b
    serial: emulator-5558

topologies:
  account_a_to_account_b:
    sender:
      account: account_a
      action_device: device_a
      include_all_devices: true
    recipient:
      account: account_b
      action_device: device_b

runner:
  start_emulators: false
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
