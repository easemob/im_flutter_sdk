name: android-423-multi-device-default

# 账号 C 保留给现有群组 case 的 user_c；本场景不需要 C 的 Runner。
accounts:
  account_a:
    provision: rest
  account_b:
    provision: rest
  account_c:
    provision: rest

# 模拟器由使用者预先启动。请只在首次配置时按 adb devices 的实际输出修改 serial。
devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 4.23.0
    account: account_a
    serial: emulator-5554

  device_a_sec:
    device_name: deviceASec
    platform: android
    sdk_version: 4.23.0
    account: account_a
    serial: emulator-5556

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 4.23.0
    account: account_b
    serial: emulator-5558

  device_b_sec:
    device_name: deviceBSec
    platform: android
    sdk_version: 4.23.0
    account: account_b
    serial: emulator-5560

topologies:
  account_b_to_account_a:
    sender:
      account: account_b
      action_device: device_b
    recipient:
      account: account_a
      # 接收账号的所有在线端都参与收消息断言；需要回执、已读等后续动作时由此端执行。
      action_device: device_a

  account_a_to_account_b:
    sender:
      account: account_a
      action_device: device_a
      include_all_devices: true
    recipient:
      account: account_b
      action_device: device_b

runner:
  start_emulators: false
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
