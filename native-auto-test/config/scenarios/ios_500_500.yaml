name: ios-500-500

accounts:
  account_a:
    provision: rest
  account_b:
    provision: rest

# 模拟器由使用者预先启动。iOS serial 是 Simulator UDID，不是设备名。
devices:
  device_a:
    device_name: deviceA
    platform: ios
    sdk_version: 5.0.0
    account: account_a
    runner_id: ios-500-device-a
    serial: 5C30BD0D-D2E0-40CE-8A4A-CAB975887F6E

  device_b:
    device_name: deviceB
    platform: ios
    sdk_version: 5.0.0
    account: account_b
    runner_id: ios-500-device-b
    serial: EE7B2CEE-7E25-43E6-8B83-8CE432CBE97D

topologies:
  account_a_to_account_b:
    sender: {account: account_a, action_device: device_a}
    recipient: {account: account_b, action_device: device_b}
