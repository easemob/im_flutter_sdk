name: android-423-multi-device

accounts:
  account_a:
    provision: rest
  account_b:
    provision: rest
  account_c:
    provision: rest

devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 4.23.0
    account: account_a
    runner_id: android-423-device-a
    serial: ${NATIVE_TEST_SERIAL_A:-}
    avd: ${NATIVE_TEST_AVD_A:-Pixel_5}

  device_a_sec:
    device_name: deviceASec
    platform: android
    sdk_version: 4.23.0
    account: account_a
    runner_id: android-423-device-a-sec
    serial: ${NATIVE_TEST_SERIAL_A_SEC:-}
    avd: ${NATIVE_TEST_AVD_A_SEC:-Pixel_5_2}

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 4.23.0
    account: account_b
    runner_id: android-423-device-b
    serial: ${NATIVE_TEST_SERIAL_B:-}
    avd: ${NATIVE_TEST_AVD_B:-}

  device_b_sec:
    device_name: deviceBSec
    platform: android
    sdk_version: 4.23.0
    account: account_b
    runner_id: android-423-device-b-sec
    serial: ${NATIVE_TEST_SERIAL_B_SEC:-}
    avd: ${NATIVE_TEST_AVD_B_SEC:-}

  device_c:
    device_name: deviceC
    platform: android
    sdk_version: 4.23.0
    account: account_c
    runner_id: android-423-device-c
    serial: ${NATIVE_TEST_SERIAL_C:-}
    avd: ${NATIVE_TEST_AVD_C:-}

  device_c_sec:
    device_name: deviceCSec
    platform: android
    sdk_version: 4.23.0
    account: account_c
    runner_id: android-423-device-c-sec
    serial: ${NATIVE_TEST_SERIAL_C_SEC:-}
    avd: ${NATIVE_TEST_AVD_C_SEC:-}

runner:
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
