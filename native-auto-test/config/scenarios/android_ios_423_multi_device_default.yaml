name: android-423-ios-424-multi-device-default

accounts:
  account_a: {provision: rest}
  account_b: {provision: rest}
  account_c: {provision: rest}

# 模拟器由使用者预先启动。iOS serial 是 Simulator UDID，不是设备名。
devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 4.23.0
    account: account_a
    serial: emulator-5554

  device_a_sec:
    device_name: deviceASec
    platform: ios
    sdk_version: 4.24.0
    account: account_a
    serial: 5C30BD0D-D2E0-40CE-8A4A-CAB975887F6E

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 4.23.0
    account: account_b
    serial: emulator-5558

  device_b_sec:
    device_name: deviceBSec
    platform: ios
    sdk_version: 4.24.0
    account: account_b
    serial: EE7B2CEE-7E25-43E6-8B83-8CE432CBE97D

topologies:
  account_a_to_account_b:
    sender:
      account: account_a
      action_device: device_a
      include_all_devices: true
    recipient: {account: account_b, action_device: device_b}

    

runner:
  start_emulators: false
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
