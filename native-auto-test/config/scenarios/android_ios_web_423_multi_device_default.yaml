name: android-423-ios-424-web-423-multi-device-default

accounts:
  account_a: {provision: rest}
  account_b: {provision: rest}
  account_c: {provision: rest}

# Android/iOS 模拟器由使用者预先启动；Web Runner 自动以独立 Chrome profile 启动。
devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 4.23.0
    account: account_a
    runner_id: android-423-device-a
    serial: emulator-5554

  device_a_sec:
    device_name: deviceASec
    platform: ios
    sdk_version: 4.24.0
    account: account_a
    runner_id: ios-423-device-a-sec
    serial: 5C30BD0D-D2E0-40CE-8A4A-CAB975887F6E

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 4.23.0
    account: account_b
    runner_id: android-423-device-b
    serial: emulator-5558

  device_b_sec:
    device_name: deviceBSec
    platform: ios
    sdk_version: 4.24.0
    account: account_b
    runner_id: ios-423-device-b-sec
    serial: EE7B2CEE-7E25-43E6-8B83-8CE432CBE97D

  device_b_web:
    device_name: deviceBWeb
    platform: web
    sdk_version: 4.23.0
    account: account_b
    runner_id: web-423-device-b

topologies:
  account_b_to_account_a:
    sender: {account: account_b, action_device: device_b}
    recipient: {account: account_a, action_device: device_a}

  account_a_to_account_b:
    sender:
      account: account_a
      action_device: device_a
      include_all_devices: true
    recipient: {account: account_b, action_device: device_b}

runner:
  start_emulators: false
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
  # 与 Android/iOS 测试 App 使用相同 App Key；可由环境变量覆盖。
  web_app_key: ${NATIVE_TEST_APP_KEY:-easemob-demo#wanganqi2}
