name: android-423-direct-chat-delivery

# 账号 C 保留给现有群组 case 的 user_c；本场景不需要 C 的 Runner。
accounts:
  account_a:
    provision: rest
  account_b:
    provision: rest
  account_c:
    provision: rest

# 模拟器由使用者预先启动。请只在首次配置时按 adb devices 的实际输出修改 serial。
devices:
  device_a:
    device_name: deviceA
    platform: android
    sdk_version: 4.23.0
    account: account_a
    runner_id: android-423-device-a
    serial: emulator-5554

  device_a_sec:
    device_name: deviceASec
    platform: android
    sdk_version: 4.23.0
    account: account_a
    runner_id: android-423-device-a-sec
    serial: emulator-5556

  device_b:
    device_name: deviceB
    platform: android
    sdk_version: 4.23.0
    account: account_b
    runner_id: android-423-device-b
    serial: emulator-5558

topologies:
  direct_chat_delivery:
    sender:
      account: account_b
      action_device: device_b
    recipient:
      account: account_a

runner:
  start_emulators: false
  device_ready_timeout: 180
  hello_timeout: 30
  start_retry: 1
  keep_device_alive: true
